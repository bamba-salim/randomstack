name: npm audit

on:
  push:
    branches: [master, main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - '.github/workflows/npm-audit.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - '.github/workflows/npm-audit.yml'
  schedule:
    # Lundi 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # high+critical bloquent ; moderate = warning (exit 0 via continue)
      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: npm audit report (all)
        if: always()
        run: npm audit --json > npm-audit.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 14
