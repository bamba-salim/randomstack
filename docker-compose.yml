services:
  postgres_db:
    image: postgres:16-alpine
    container_name: randomstack_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
    container_name: randomstack_server
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - server_node_modules:/app/apps/server/node_modules
    ports:
      - "${PORT}:${PORT}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres_db:
        condition: service_healthy
    command: sh -c "npx prisma generate --config=apps/server/prisma.config.ts && npx prisma db push --config=apps/server/prisma.config.ts && npm run dev --workspace=apps/server"

  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
    container_name: randomstack_worker
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - server_node_modules:/app/apps/server/node_modules
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres_db:
        condition: service_healthy
      server:
        condition: service_started
    command: npm run dev:worker --workspace=apps/server

  prisma-studio:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
    container_name: randomstack_prisma_studio
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/server/node_modules
    ports:
      - "${PRISMA_STUDIO_PORT}:5555"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - postgres_db
    command: npx prisma studio --config=apps/server/prisma.config.ts --port 5555 --browser none

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile.dev
    container_name: randomstack_client
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/client/node_modules
    ports:
      - "${CLIENT_PORT}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - server
    command: npm run dev --workspace=apps/client -- --host

  extranet:
    build:
      context: .
      dockerfile: apps/extranet/Dockerfile.dev
    container_name: randomstack_extranet
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/extranet/node_modules
    ports:
      - "${EXTRANET_PORT}:5175"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - server
    command: npm run dev --workspace=apps/extranet -- --host

volumes:
  postgres_data:
  root_node_modules:
  server_node_modules:
